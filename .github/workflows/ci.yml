name: Offline verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core package
        run: python -m pip install .
      - name: Test protocol, persistence, transports and orchestration
        run: python scripts/check.py
      - name: Run bounded scripted demonstration
        run: python -m danus_rsi demo --state .state/ci-demo --cycles 2 --limit 4
      - name: Validate wheel data and console entry point
        working-directory: ${{ runner.temp }}
        run: danus-rsi init --state danus-rsi-package-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scripted-report-${{ matrix.os }}-${{ matrix.python }}
          path: .state/ci-demo/reports/*/report.html
          include-hidden-files: true
          retention-days: 7
